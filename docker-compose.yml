# Local Postgres 16 for dev + tests (docs/01-architecture.md §1, docs/12-demo-and-ops.md).
# `pnpm db:up` starts it. Owner role: postgres/postgres (LOCAL ONLY).
# The init script creates `relay_test` and a LOGIN password for app_user (local dev only;
# on Neon the roles migration creates app_user with APP_DB_PASSWORD).
services:
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: relay
    ports:
      - '5432:5432'
    volumes:
      - relay-pg:/var/lib/postgresql/data
      - ./docker/postgres/init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U postgres -d relay']
      interval: 2s
      timeout: 3s
      retries: 30
volumes:
  relay-pg:
